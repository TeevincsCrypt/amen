[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "shanghai"   # conservative: PUSH0 is supported on Nitro; no transient storage needed
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
  { access = "read", path = "./config" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 512

[profile.ci.fuzz]
runs = 4096

[rpc_endpoints]
# Robinhood Chain mainnet (chain id 4663)
robinhood = "https://rpc.mainnet.chain.robinhood.com"
# Robinhood Chain testnet (chain id 46630)
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
# Alchemy (set ALCHEMY_KEY)
robinhood_alchemy = "https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 110

[lint]
lint_on_build = false
